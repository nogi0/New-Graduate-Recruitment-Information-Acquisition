name: 新卒採用ニュース自動収集

on:
  schedule:
    # 毎週月曜 09:00 JST (00:00 UTC)
    - cron: "0 0 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Collect news via Google News RSS
        run: python3 scripts/collect_news.py

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "新卒採用まわりの最新情報を自動収集"
          title: "[自動収集] 新卒採用ニュース更新"
          body: |
            Google News RSSから新着記事を自動収集しました。
            内容を確認のうえ、問題なければマージしてください。
          branch: auto/collect-news
          delete-branch: true
