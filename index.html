<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新卒採用インフォメーションハブ</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <h1>新卒採用インフォメーションハブ</h1>
    <p class="subtitle">新卒採用ニュース / マーケットレポート / AI活用事例を一箇所でキャッチアップ</p>
  </div>
</header>

<nav class="tabs" id="tabs">
  <button class="tab-btn active" data-target="news">採用ニュース</button>
  <button class="tab-btn" data-target="market-reports">マーケットレポート</button>
  <button class="tab-btn" data-target="ai-cases">AI活用事例</button>
  <button class="tab-btn" data-target="bookmarks">★ ブックマーク<span class="tab-count" id="bookmark-count">0</span></button>
</nav>

<main class="container">
  <section id="news" class="panel active">
    <div class="panel-list" data-source="data/news.json"></div>
  </section>
  <section id="market-reports" class="panel">
    <div class="panel-list" data-source="data/market-reports.json"></div>
  </section>
  <section id="ai-cases" class="panel">
    <div class="panel-list" data-source="data/ai-cases.json"></div>
  </section>
  <section id="bookmarks" class="panel">
    <div class="bookmark-tools">
      <div class="bookmark-tools-row">
        <button type="button" class="tool-btn" id="export-copy-btn">📋 コピー</button>
        <button type="button" class="tool-btn" id="export-download-btn">⬇️ ダウンロード</button>
        <button type="button" class="tool-btn" id="discord-send-btn">💬 Discordに送信</button>
        <button type="button" class="tool-btn tool-btn-ghost" id="discord-settings-toggle">⚙️ Discord設定</button>
      </div>
      <div class="discord-settings" id="discord-settings" hidden>
        <label class="discord-settings-label" for="discord-webhook-input">Discord Webhook URL</label>
        <div class="discord-settings-row">
          <input type="password" id="discord-webhook-input" class="discord-webhook-input" placeholder="https://discord.com/api/webhooks/...">
          <button type="button" class="tool-btn" id="discord-webhook-save">保存</button>
          <button type="button" class="tool-btn tool-btn-ghost" id="discord-webhook-clear">削除</button>
        </div>
        <p class="discord-settings-note">
          このURLはあなたのブラウザ（localStorage）にだけ保存され、サイトのコード（GitHubリポジトリ）には一切保存されません。
          Discordサーバーの「連携サービス」→「ウェブフック」から発行できます。
        </p>
      </div>
      <div class="bookmark-tools-status" id="bookmark-tools-status"></div>
    </div>
    <div class="panel-list" id="bookmark-list"></div>
  </section>
</main>

<footer class="site-footer">
  <p>データは <code>data/*.json</code> を手動で更新して反映します。最終更新は各カードのソースリンク先で確認してください。</p>
</footer>

<script src="js/main.js"></script>
</body>
</html>
